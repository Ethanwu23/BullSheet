name: US Market Daily（美股每日简报，产出一张长图）

on:
  schedule:
    # UTC 22:30 ≈ 美东夏令时 18:30 / 冬令时 17:30（盘后）
    # 注意：GitHub Actions cron 不保证精确到分钟，可能延迟；
    # 目标交易日由程序按美东时间解析为"最近一个已收盘交易日"，不依赖触发时间。
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      run_date:
        description: "目标日期 YYYY-MM-DD（留空则由程序自动解析最近已收盘交易日）"
        required: false
        default: ""
      mode:
        description: "运行模式（第一版仅支持 after_close）"
        required: false
        default: "after_close"
        type: choice
        options:
          - after_close
      offline:
        description: "使用 fixture 离线运行（不访问网络）"
        required: false
        default: false
        type: boolean
      template:
        description: "图片模板（留空则用 IMAGE_TEMPLATE Variable，默认 one_page）"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - one_page
          - daily_review
          - flash_brief

permissions:
  contents: read

# 避免同一天重复生成内容（FR-048）
concurrency:
  group: us-market-daily-${{ github.event.inputs.run_date || github.run_id }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装中文字体（CI 默认没有中文字体）
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -fv || true

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 校验配置
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'rule_based' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          MARKET_PROVIDER: ${{ vars.MARKET_PROVIDER || 'yahoo' }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || 'USMarketDaily/0.1 (actions@users.noreply.github.com)' }}
        run: usmarket check-config

      - name: 生成日报与图文
        id: generate
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'rule_based' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          # 百炼关闭思考链（实测：开启时一次生成 100-120s 易超时，关闭后 30-40s）
          # 注意：值是 JSON，含冒号+空格会破坏 YAML 解析，因此默认值放 Variables 而非此处
          LLM_EXTRA_BODY_JSON: "${{ vars.LLM_EXTRA_BODY_JSON }}"
          LLM_TIMEOUT_SECONDS: ${{ vars.LLM_TIMEOUT_SECONDS || '180' }}
          # 25 条来源的 URL 很占输出 token，4000 会被截断导致 JSON 不完整
          LLM_MAX_TOKENS: ${{ vars.LLM_MAX_TOKENS || '8000' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MARKET_PROVIDER: ${{ vars.MARKET_PROVIDER || 'yahoo' }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || 'USMarketDaily/0.1 (actions@users.noreply.github.com)' }}
          LOG_LEVEL: INFO
        run: |
          set -o pipefail
          ARGS=()
          if [ -n "${{ github.event.inputs.run_date }}" ]; then
            ARGS+=(--date "${{ github.event.inputs.run_date }}")
          fi
          if [ "${{ github.event.inputs.offline }}" = "true" ]; then
            ARGS+=(--offline)
          fi
          # 模板优先级：手动输入 > IMAGE_TEMPLATE Variable > one_page（单图默认）
          ARGS+=(--template "${{ github.event.inputs.template || vars.IMAGE_TEMPLATE || 'one_page' }}")
          usmarket generate "${ARGS[@]}" 2>&1 | tee generate.log
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: 解析目标日期
        id: resolve
        run: |
          DATE=$(usmarket schedule --at "$(date -u +%Y-%m-%dT%H:%M:%S+00:00)" --json | python -c 'import json,sys; print(json.load(sys.stdin)["target_date"])')
          if [ -n "${{ github.event.inputs.run_date }}" ]; then
            DATE="${{ github.event.inputs.run_date }}"
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: 上传产物（日报 / 图片 / 任务状态 / 日志）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-${{ steps.resolve.outputs.date }}
          path: |
            data/${{ steps.resolve.outputs.date }}/
            generate.log
          if-no-files-found: warn
          retention-days: 14

      - name: 失败摘要
        if: failure()
        run: |
          echo "## ❌ 每日任务失败" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- 目标日期：\`${{ steps.resolve.outputs.date }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 工作流运行：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### 最近日志" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 40 generate.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: 成功摘要
        if: success()
        run: |
          echo "## ✅ 每日内容已生成（待人工审核）" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- 目标日期：\`${{ steps.resolve.outputs.date }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 状态：\`review\`，需人工审核后才会发布" >> "$GITHUB_STEP_SUMMARY"
          echo "- 产物见本工作流的 artifacts" >> "$GITHUB_STEP_SUMMARY"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装中文字体与依赖
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: 静态检查
        run: |
          python -m ruff check src tests
      - name: 运行测试（离线，不依赖外部服务）
        run: |
          python -m pytest tests -q
